<!-- Plantillas de la instalación de la app (PWA).
     Cada <template> es un molde: el navegador no lo muestra; el JavaScript lo clona y le pone los datos. -->

<!-- Botón de la cabecera para instalar la app. -->
<template id="plantilla-galeno-boton-instalar">
    <style>
        :host { display:inline-block; }
        :host([hidden]) { display:none; }
        button { display:inline-flex; align-items:center; gap:.4rem; min-height:2.75rem;
                 padding:.35rem .85rem; border:1px solid var(--instalar-borde, #527C80);
                 border-radius:999px; background:var(--instalar-fondo, #E9F1EF);
                 color:var(--tinta, #1D3461); cursor:pointer; font:inherit;
                 font-size:var(--fs-1, .875rem); font-weight:600; }
        button:hover { background:var(--instalar-hover, #CFE3DD); border-color:var(--foco, #2F6F73); }
        button:focus-visible { outline:3px solid var(--foco, #2F6F73); outline-offset:2px; }
        button svg { width:1.1rem; height:1.1rem; flex:0 0 auto; }
        button[hidden] { display:none; }
        @media (max-width:47.9999em) {
            button { padding:.35rem .6rem; }
            .texto { display:none; }
        }
    </style>
    <button type="button" aria-label="Instalar app" title="Instalar app">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="4.5" y="3" width="15" height="18" rx="2.5"/><path d="M12 8v7.2m0 0-2.7-2.7m2.7 2.7 2.7-2.7"/></svg>
      <span class="texto">Instalar app</span>
    </button>
</template>

<!-- Invitación a instalar que aparece después de descargar un ticket. -->
<template id="plantilla-galeno-invitacion">
    <style>
        :host { display:block; height:0; }
        .tarjeta { position:fixed; z-index:80; display:block;
                   background:var(--superficie, #fff); color:var(--tinta, #1D3461);
                   border:1px solid var(--borde, #DCE9F0); border-radius:var(--radio-tarjeta, .875rem);
                   box-shadow:var(--sombra-2, 0 6px 18px rgba(29,52,97,.12));
                   padding:.9rem 1rem; font-family:inherit; max-width:20rem;
                   animation:invitacion-entrada 200ms ease-out; }
        .tarjeta[hidden] { display:none; }
        @media (max-width:47.9999em) {
            .tarjeta { left:.5rem; right:.5rem; bottom:calc(var(--barra-movil, 0rem) + env(safe-area-inset-bottom, 0px) + .5rem);
                       max-width:none; }
        }
        @media (min-width:48em) {
            .tarjeta { right:1rem; bottom:1.2rem; }
        }
        .encabezado { display:flex; align-items:flex-start; gap:.5rem; }
        .encabezado svg { color:var(--exito, #4F8A6B); flex:0 0 auto; margin-top:.15rem; }
        .titulo { flex:1 1 auto; margin:0; font-size:var(--fs-2, 1rem); font-weight:700; }
        .cerrar { flex:0 0 auto; display:inline-flex; align-items:center; justify-content:center;
                  width:2rem; height:2rem; margin:-.25rem -.3rem 0 0; padding:0; border:0; border-radius:50%;
                  background:none; color:inherit; cursor:pointer; }
        .cerrar:hover { background:var(--celeste, #E3F1F7); }
        .cerrar:focus-visible { outline:3px solid var(--foco, #2F6F73); outline-offset:2px; }
        .texto { margin:.35rem 0 .8rem; font-size:var(--fs-1, .875rem); color:var(--texto, #26354E); }
        .fila { display:flex; align-items:center; gap:.6rem; flex-wrap:wrap; }
        .fila button { min-height:2.75rem; border-radius:999px; padding:.35rem 1rem; cursor:pointer;
                       font:inherit; font-size:var(--fs-1, .875rem); font-weight:600;
                       transition:background var(--velocidad, 180ms); }
        .primario { border:1px solid var(--primario, #2F6F73); background:var(--primario, #2F6F73);
                    color:var(--sobre-primario, #fff); }
        .primario:hover { background:var(--primario-oscuro, #0F6461); }
        .primario:focus-visible { outline:3px solid var(--foco, #2F6F73); outline-offset:2px; }
        .ahora-no { border:0; background:none; color:var(--tinta-suave, #44577B);
                    text-decoration:underline; text-underline-offset:2px; padding:.2rem .4rem; }
        .ahora-no:hover { color:var(--tinta, #1D3461); }
        .ahora-no:focus-visible { outline:3px solid var(--foco, #2F6F73); outline-offset:2px; }
        @keyframes invitacion-entrada { from { opacity:0; transform:translateY(1rem); } to { opacity:1; transform:none; } }
        @media (prefers-reduced-motion: reduce) { .tarjeta { animation:none; } .fila button { transition:none; } }
    </style>
    <div class="tarjeta" role="status" aria-live="polite" hidden>
      <div class="encabezado">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="9"/><path d="m8 12.2 2.6 2.6L16.4 9"/></svg>
        <h2 class="titulo" id="titulo-invitacion">¡Tu ticket está listo!</h2>
        <button class="cerrar" type="button" aria-label="Cerrar la invitación"><svg viewBox="0 0 20 20" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" focusable="false"><path d="m5 5 10 10m0-10L5 15"/></svg></button>
      </div>
      <p class="texto">Instala GalenoSV y llévalo contigo: acceso directo, pantalla completa y lo que ya consultaste disponible incluso sin conexión.</p>
      <div class="fila">
        <button class="primario" type="button">Instalar</button>
        <button class="ahora-no" type="button">Ahora no</button>
      </div>
    </div>
</template>

<!-- Guía para instalar en iPhone (Safari no ofrece el botón de instalar). -->
<template id="plantilla-galeno-guia">
    <style>
        :host { display:block; height:0; }
        .fondo { position:fixed; inset:0; z-index:90; display:block;
                 background:rgba(15, 30, 38, .45); }
        .fondo[hidden] { display:none; }
        .caja { position:fixed; left:50%; top:50%; transform:translate(-50%, -50%); z-index:91;
                display:block;
                width:min(22rem, calc(100vw - 2rem)); max-height:calc(100vh - 2rem); overflow:auto;
                background:var(--superficie, #fff); color:var(--tinta, #1D3461);
                border:1px solid var(--borde, #DCE9F0); border-radius:var(--radio-tarjeta, .875rem);
                box-shadow:var(--sombra-2, 0 6px 18px rgba(29,52,97,.12));
                padding:1rem 1.1rem; font-family:inherit;
                animation:guia-entrada 200ms ease-out; }
        .caja[hidden] { display:none; }
        .encabezado { display:flex; align-items:center; gap:.5rem; }
        .encabezado svg { color:var(--primario, #2F6F73); flex:0 0 auto; }
        h2 { flex:1 1 auto; margin:0; font-size:var(--fs-2, 1rem); }
        .cerrar { flex:0 0 auto; display:inline-flex; align-items:center; justify-content:center;
                  width:2.5rem; height:2.5rem; margin:-.3rem -.4rem 0 0; padding:0; border:0; border-radius:50%;
                  background:none; color:inherit; cursor:pointer; }
        .cerrar:hover { background:var(--celeste, #E3F1F7); }
        .cerrar:focus-visible { outline:3px solid var(--foco, #2F6F73); outline-offset:2px; }
        ol { list-style:none; margin:.8rem 0 0; padding:0; display:grid; gap:.8rem; }
        li { display:flex; align-items:flex-start; gap:.6rem; }
        .icono { width:2.4rem; height:2.4rem; flex:0 0 auto; display:grid; place-items:center;
                 border:1px solid var(--secundario-borde, #AECFC6); border-radius:var(--radio-control, .625rem);
                 background:var(--primario-suave, #E9F1EF); color:var(--primario, #2F6F73); }
        .icono svg { width:1.3rem; height:1.3rem; }
        .paso-texto { display:flex; flex-direction:column; gap:.15rem; font-size:var(--fs-1, .875rem); }
        .paso-texto small { color:var(--tinta-suave, #44577B); }
        .nota { margin:.8rem 0 0; font-size:var(--fs-0, .75rem); color:var(--tinta-suave, #44577B); }
        @keyframes guia-entrada { from { opacity:0; transform:translate(-50%, calc(-50% + 1rem)); }
                                  to { opacity:1; transform:translate(-50%, -50%); } }
        @media (prefers-reduced-motion: reduce) { .caja { animation:none; } }
    </style>
    <div class="fondo" hidden></div>
    <div class="caja" role="dialog" aria-modal="true" aria-labelledby="guia-titulo" hidden>
      <div class="encabezado">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M11 18.5h2"/></svg>
        <h2 id="guia-titulo">Instalar GalenoSV en iPhone</h2>
        <button class="cerrar" type="button" aria-label="Cerrar la guía"><svg viewBox="0 0 20 20" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" focusable="false"><path d="m5 5 10 10m0-10L5 15"/></svg></button>
      </div>
      <ol>
        <li>
          <span class="icono"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 15V4m0 0-3 3m3-3 3 3"/><path d="M6 10v8.5A1.5 1.5 0 0 0 7.5 20h9a1.5 1.5 0 0 0 1.5-1.5V10"/></svg></span>
          <span class="paso-texto"><strong>1. Toque Compartir</strong><small>En Safari, pulse el boton Compartir de la barra inferior.</small></span>
        </li>
        <li>
          <span class="icono"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="6.5" y="2.5" width="11" height="19" rx="2.5"/><path d="M12 18.5h.01"/></svg></span>
          <span class="paso-texto"><strong>2. Elija «Agregar a pantalla de inicio»</strong><small>Baje en la lista de opciones y elija «Agregar a pantalla de inicio».</small></span>
        </li>
        <li>
          <span class="icono"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="4.5" y="3" width="15" height="18" rx="2.5"/><path d="M12 8v7.2m0 0-2.7-2.7m2.7 2.7 2.7-2.7"/></svg></span>
          <span class="paso-texto"><strong>3. Confirme con «Agregar»</strong><small>Pulse «Agregar»: GalenoSV queda con su propio icono y pantalla completa.</small></span>
        </li>
      </ol>
      <p class="nota">Pasos de Safari en iPhone o iPad. Solo toma unos segundos y no borra nada.</p>
    </div>
</template>
