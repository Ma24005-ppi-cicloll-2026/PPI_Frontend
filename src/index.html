<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GalenoSV</title>
    <meta name="description" content="GalenoSV: sistema de gestión médica">
    <meta name="theme-color" content="#1D3461">
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" type="image/png" href="./recursos/iconos/icon-192.png">
    <link rel="apple-touch-icon" href="./recursos/iconos/icon-192.png">
    <link rel="stylesheet" href="./recursos/principal.css">
    <link rel="stylesheet" href="./recursos/galeno.css">
</head>
<body>
    <a class="saltar" href="#/" id="saltar">Saltar al contenido</a>
    <galeno-conexion></galeno-conexion>
    <div class="app">
        <header>
            <h1>GalenoSV</h1>
            <span id="sesion" aria-live="polite"></span>
            <galeno-instalar id="instalar"></galeno-instalar>
        </header>
        <nav aria-label="Menú principal">
            <galeno-menu id="menu"></galeno-menu>
        </nav>
        <main id="pantalla" tabindex="-1"></main>
        <footer>
            GalenoSV · Sistema de gestión médica
        </footer>
    </div>
    <galeno-notificacion-emergente id="aviso"></galeno-notificacion-emergente>

    <!-- 1. Services (control) -->
    <script src="js/control/default_service.js"></script>
    <script src="js/control/clinica_service.js"></script>
    <script src="js/control/consulta_service.js"></script>
    <script src="js/control/consulta_procedimiento_service.js"></script>
    <script src="js/control/consulta_procedimiento_paso_service.js"></script>
    <script src="js/control/documento_service.js"></script>
    <script src="js/control/examen_service.js"></script>
    <script src="js/control/examen_resultado_service.js"></script>
    <script src="js/control/examen_tipo_examen_service.js"></script>
    <script src="js/control/medio_contacto_service.js"></script>
    <script src="js/control/orden_examen_service.js"></script>
    <script src="js/control/persona_service.js"></script>
    <script src="js/control/persona_rol_service.js"></script>
    <script src="js/control/procedimiento_service.js"></script>
    <script src="js/control/procedimiento_paso_service.js"></script>
    <script src="js/control/procedimiento_paso_examen_service.js"></script>
    <script src="js/control/procedimiento_paso_secuencia_service.js"></script>
    <script src="js/control/rol_service.js"></script>
    <script src="js/control/tipo_documento_service.js"></script>
    <script src="js/control/tipo_examen_service.js"></script>
    <script src="js/control/tipo_medio_contacto_service.js"></script>
    <script src="js/control/gestor_fechas.js"></script>
    <script src="js/control/datos_clinica.js"></script>
    <script src="js/control/documentos.js"></script>
    <script src="js/control/agenda.js"></script>
    <script src="js/control/flujo_pasos.js"></script>
    <script src="js/control/notas_paso.js"></script>
    <script src="js/control/expediente.js"></script>
    <script src="js/control/sesion.js"></script>
    <script src="js/control/pwa.js"></script>

    <!-- 2. Componentes (autocomplete ANTES de buscador_tipo_documentos) -->
    <script src="js/boundary/componentes/campo.js"></script>
    <script src="js/boundary/componentes/opcion.js"></script>
    <script src="js/boundary/componentes/autocomplete.js"></script>
    <script src="js/boundary/componentes/buscador_tipo_documentos.js"></script>
    <script src="js/boundary/componentes/selector.js"></script>
    <script src="js/boundary/componentes/estado_conexion.js"></script>
    <script src="js/boundary/componentes/estado_vista.js"></script>
    <script src="js/boundary/componentes/instalar_app.js"></script>
    <script src="js/boundary/componentes/menu_navegacion.js"></script>
    <script src="js/boundary/componentes/notificacion_emergente.js"></script>
    <script src="js/boundary/componentes/tarjeta_cita.js"></script>
    <script src="js/boundary/componentes/tarjeta_agenda.js"></script>
    <script src="js/boundary/componentes/registro_paso.js"></script>
    <script src="js/boundary/componentes/indicador_pasos.js"></script>
    <script src="js/boundary/componentes/lista_examenes.js"></script>

    <!-- 3. Models (boundary): los auxiliares primero, app_model.js al final -->
    <script src="js/boundary/login_model.js"></script>
    <script src="js/boundary/citas_model.js"></script>
    <script src="js/boundary/dashboard_model.js"></script>
    <script src="js/boundary/seguimiento_model.js"></script>
    <script src="js/boundary/app_model.js"></script>
    <script>
        new AppModel().iniciar();
        // PWA: registra el service worker (funciona sin conexion) y conecta el boton "Instalar app"
        const pwa = new Pwa();
        pwa.iniciar();
        document.querySelector("#instalar").pwa = pwa;
        // "Saltar al contenido": mueve el foco a la pantalla sin tocar la direccion (#/...) de la SPA
        document.querySelector("#saltar").addEventListener("click", e => {
            e.preventDefault();
            document.querySelector("#pantalla").focus();
        });
    </script>
</body>
</html>
